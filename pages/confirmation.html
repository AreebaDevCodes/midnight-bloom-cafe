<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Reservation confirmed at Midnight Bloom Café.">

    <title>Reservation Confirmed | Midnight Bloom Café</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>


    <!-- =========================
         Confirmation
    ========================== -->

    <main class="confirmation-page">

        <div class="confirmation-card">


            <div class="confirmation-icon">
                ✓
            </div>


            <p class="section-label">
                MIDNIGHT BLOOM
            </p>


            <h1>
                Reservation
                <span>Confirmed.</span>
            </h1>


            <p class="confirmation-message">
                Thank you for choosing Midnight Bloom Café.
                Your table is waiting for you.
            </p>


            <!-- Reservation Details -->

            <div class="confirmation-details">


                <div class="confirmation-detail">

                    <span>
                        Name
                    </span>

                    <strong id="confirm-name">
                        —
                    </strong>

                </div>


                <div class="confirmation-detail">

                    <span>
                        Date
                    </span>

                    <strong id="confirm-date">
                        —
                    </strong>

                </div>


                <div class="confirmation-detail">

                    <span>
                        Time
                    </span>

                    <strong id="confirm-time">
                        —
                    </strong>

                </div>


                <div class="confirmation-detail">

                    <span>
                        Guests
                    </span>

                    <strong id="confirm-guests">
                        —
                    </strong>

                </div>


                <div
                    class="confirmation-detail confirmation-request">

                    <span>
                        Special Request
                    </span>

                    <strong id="confirm-request">
                        —
                    </strong>

                </div>


            </div>


            <!-- Actions -->

            <div class="confirmation-actions">

                <a
                    href="../index.html"
                    class="primary-button">

                    Back to Home

                    <span>→</span>

                </a>


                <a
                    href="menu.html"
                    class="secondary-button">

                    Explore Menu

                </a>

            </div>


        </div>

    </main>


    <!-- JavaScript -->

    <script src="../js/app.js"></script>
<script>

    const reservation =
        JSON.parse(
            localStorage.getItem(
                "midnightBloomReservation"
            )
        );

    if (reservation) {

        document.getElementById("confirm-name").textContent =
            reservation.name;

        document.getElementById("confirm-date").textContent =
            reservation.date;

        document.getElementById("confirm-time").textContent =
            reservation.time;

        document.getElementById("confirm-guests").textContent =
            reservation.guests;

        document.getElementById("confirm-request").textContent =
            reservation.request || "None";

    }

</script>

</body>

</html>
