<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Reserve your table at Midnight Bloom Café.">

    <title>Reserve a Table | Midnight Bloom Café</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>

    <!-- Reservation Navigation -->

<header class="reservation-header">

    <a href="../index.html" class="reservation-logo">
        Midnight Bloom
        <span>Café</span>
    </a>

    <a href="javascript:history.back()" class="reservation-back">
        ← Back
    </a>

</header>

    <!-- =========================
         Reservation Page
    ========================== -->

    <main class="reservation-page">

        <div class="reservation-page-content">

    <div class="reservation-intro">

        <p class="section-label">
            MIDNIGHT BLOOM
        </p>

        <h1>
            Reserve your
            <span>moment.</span>
        </h1>

        <p>
            Tell us a little about your visit
            and we'll have your table ready.
        </p>

    </div>


    <form class="reservation-form">

        <div class="form-group">

            <label for="guest-name">
                Your Name
            </label>

            <input
                type="text"
                id="guest-name"
                name="guestName"
                placeholder="Enter your name"
                required>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="reservation-date">
                    Date
                </label>

                <input
                    type="date"
                    id="reservation-date"
                    name="date"
                    required>

            </div>
<div class="form-group">

    <label for="reservation-time">
        Time
    </label>

    <input
        type="text"
        id="reservation-time"
        name="time"
        placeholder="07:30 PM"
        autocomplete="off"
        maxlength="8"
        required>

</div>
        <div class="form-group">

            <label for="guests">
                Number of Guests
            </label>

            <select
                id="guests"
                name="guests"
                required>

                <option value="">
                    Select guests
                </option>

                <option value="1">
                    1 Guest
                </option>

                <option value="2">
                    2 Guests
                </option>

                <option value="3">
                    3 Guests
                </option>

                <option value="4">
                    4 Guests
                </option>

                <option value="5">
                    5 Guests
                </option>

                <option value="6">
                    6 Guests
                </option>

                <option value="7+">
                    7+ Guests
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="special-request">
                Special Request
                <span>(Optional)</span>
            </label>

            <textarea
                id="special-request"
                name="specialRequest"
                rows="4"
                placeholder="Anything you'd like us to know?"></textarea>

        </div>


        <button
            type="submit"
            class="primary-button reservation-submit">

            Confirm Reservation

            <span>→</span>

        </button>

    </form>

</div>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
