<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Your Midnight Bloom Café order confirmation.">

    <title>Order Confirmed | Midnight Bloom Café</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>

    <!-- =========================
         Confirmation Navigation
    ========================== -->

    <header class="reservation-header">

        <a
            href="../index.html"
            class="reservation-logo">

            Midnight Bloom
            <span>Café</span>

        </a>

        <a
            href="../index.html"
            class="reservation-back">

            ← Back to Home

        </a>

    </header>


    <!-- =========================
         Order Confirmation
    ========================== -->

    <main class="order-confirmation-page">

        <div class="order-confirmation-container">

            <div class="confirmation-icon">
                ✓
            </div>

            <p class="section-label">
                MIDNIGHT BLOOM
            </p>

            <h1>
                Your order is
                <span>confirmed.</span>
            </h1>

            <p class="confirmation-message">
                Thank you, <strong id="confirmation-name"></strong>.
                Your order has been received successfully.
            </p>


            <!-- Customer Details -->

            <div class="confirmation-details">

                <div class="confirmation-detail">

                    <span>
                        Order Type
                    </span>

                    <strong id="confirmation-type">
                        —
                    </strong>

                </div>


                <div class="confirmation-detail">

                    <span>
                        Phone
                    </span>

                    <strong id="confirmation-phone">
                        —
                    </strong>

                </div>

            </div>


            <!-- Order Items -->

            <div class="confirmation-order">

                <h2>
                    Your Order
                </h2>

                <div
                    id="confirmation-items"
                    class="confirmation-items">

                </div>


                <div class="confirmation-total">

                    <span>
                        Total
                    </span>

                    <strong id="confirmation-total">
                        $0.00
                    </strong>

                </div>

            </div>


            <a
                href="../index.html"
                class="primary-button confirmation-home">

                Back to Home

                <span>→</span>

            </a>

        </div>

    </main>


    <script src="../js/app.js"></script>

</body>

</html>
