<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Complete your order at Midnight Bloom Café.">

    <title>Checkout | Midnight Bloom Café</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>


    <!-- =========================
         Checkout Navigation
    ========================== -->

    <header class="reservation-header">

        <a
            href="../index.html"
            class="reservation-logo">

            Midnight Bloom
            <span>Café</span>

        </a>


        <a
            href="javascript:history.back()"
            class="reservation-back">

            ← Back

        </a>

    </header>



    <!-- =========================
         Checkout Page
    ========================== -->

    <main class="checkout-page">


        <div class="checkout-container">


            <!-- Heading -->

            <div class="checkout-intro">

                <p class="section-label">
                    MIDNIGHT BLOOM
                </p>

                <h1>
                    Complete your
                    <span>order.</span>
                </h1>

                <p>
                    Just a few details and we'll
                    have everything ready for you.
                </p>

            </div>



            <!-- Customer Information -->

            <section class="checkout-section">

                <h2>
                    Your Details
                </h2>


                <div class="checkout-form-row">

                    <div class="form-group">

                        <label for="order-name">
                            Your Name
                        </label>

                        <input
                            type="text"
                            id="order-name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="order-phone">
                            Phone Number
                        </label>

                        <input
    type="tel"
    id="order-phone"
    name="phone"
    placeholder="03XX XXXXXXX"
    inputmode="tel"
    autocomplete="tel"
    maxlength="11"
    required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="order-type">
                        Order Type
                    </label>

                    <select id="order-type">

                        <option value="">
                            Select order type
                        </option>

                        <option value="Dine-in">
                            Dine-in
                        </option>

                        <option value="Takeaway">
                            Takeaway
                        </option>

                    </select>

                </div>

            </section>



            <!-- Order Summary -->

            <section class="checkout-section">

                <h2>
                    Your Order
                </h2>


                <div
                    id="checkout-items"
                    class="checkout-items">

                    <!-- Items will appear here -->

                </div>


                <div class="checkout-total">

                    <span>
                        Total
                    </span>

                    <strong id="checkout-total">
                        $0.00
                    </strong>

                </div>

            </section>



            <!-- Place Order -->

            <button
                type="button"
                id="place-order"
                class="primary-button checkout-submit">

                Place Order

                <span>→</span>

            </button>


        </div>

    </main>



    <!-- JavaScript -->

    <script src="../js/app.js"></script>

</body>

</html>
